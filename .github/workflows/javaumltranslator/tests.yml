on: push

jobs:
  tests:
    name: Tests
    strategy:
      matrix: { os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ./javaumltranslator
    steps:
      - name: Build Project
        uses: ./.github/workflows/build.yml

      - name: Test Project
        run: npm test