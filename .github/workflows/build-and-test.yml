on:
  push:
  workflow_dispatch: 
    
jobs:
  build:
    name: Build & Test
    strategy:
      matrix: { dir: ['./javaumltranslator', './protobufumltranslator'], os: [ubuntu-latest, windows-latest] }
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        id: setup-node
        uses: actions/setup-node@v4
        with:
          node-version: 20.15.0

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run --if-present build
        
      - name: Test Project
        run: npm test
