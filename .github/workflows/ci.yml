name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  NODE_VERSION: 24.x

jobs:
  build-test:
    name: Build & Test (${{ matrix.workspace }}
    strategy:
      fail-fast: false
      matrix:
        workspace:
          [
            'javaumltranslator',
            'protobufumltranslator',
            '@lumber/datamodel',
            '@lumber/uml-engine',
            '@lumber/java-engine'
          ]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Test
        run: npm test -w ${{ matrix.workspace }}

  lint-and-format:
    name: Lint & Format (${{ matrix.workspace }})
    strategy:
      fail-fast: false
      matrix:
        workspace: [javaumltranslator, protobufumltranslator]

    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Use Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm install

      - name: Lint check
        run: npm run lint:check -w ${{ matrix.workspace }}

      - name: Format check
        run: npm run format:check -w ${{ matrix.workspace }}
